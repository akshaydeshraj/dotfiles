# Tokyo Night Storm theme for Atuin
# Palette source-of-truth: ~/Code/personal/dotfiles/themes/tokyo-night-storm/palette.sh
#
# Activation: ~/.config/atuin/config.toml must contain
#   [theme]
#   name = "tokyo-night-storm"

[theme]
name = "tokyo-night-storm"
parent = "default"

[colors]
AlertInfo = "#7aa2f7"     # blue
AlertWarn = "#e0af68"     # yellow
AlertError = "#f7768e"    # red
Annotation = "#7dcfff"    # cyan
Base = "#c0caf5"          # fg
Guidance = "#9ece6a"      # green
Important = "#e0af68"     # yellow
Title = "#e0af68"         # yellow (accent)
Muted = "#414868"         # br-black / dim
