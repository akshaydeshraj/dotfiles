# =============================================
# dmux recommended tmux config
# Theme: dark
# Generated by dmux onboarding
# =============================================

# When a session is destroyed, switch to another instead of detaching
set -g detach-on-destroy off

# Better support for Ctrl+Shift arrow bindings on newer tmux versions
set -gq extended-keys on
set -g extended-keys-format csi-u

# Pane visuals — Cobalt2
set -g pane-border-format ' #[bold]#P #[default]#{?pane_title,#{pane_title},#{pane_current_command}} '
set -g pane-border-status top
set -g pane-border-lines single
set -g window-style 'fg=#ffffff,bg=default'
set -g window-active-style 'fg=#ffffff,bg=default'
set -g pane-border-style "fg=#ffc600 bg=default"
set -g pane-active-border-style "fg=#ffc600 bg=default"

# Status bar — Cobalt2
set -g status-style 'fg=#ffffff,bg=#0d3a58'
set -g status-left '#[fg=#122738,bg=#ffc600,bold] #S #[fg=#ffc600,bg=#0d3a58,nobold]'
set -g status-right '#[fg=#ff628c,bg=#0d3a58]#(cat $HOME/.cache/claude-notify/.count 2>/dev/null)#[fg=#80fcff,bg=#0d3a58]#(~/.config/tmux/pr-state.sh #S 2>/dev/null) #[fg=#0088ff,bg=#0d3a58]#[fg=#ffffff,bg=#0088ff] %H:%M #[fg=#ffc600,bg=#0088ff]#[fg=#122738,bg=#ffc600,bold] %d-%b '
set -g status-interval 5
set -g window-status-format '#[fg=#80fcff,bg=#0d3a58] #I:#W '
set -g window-status-current-format '#[fg=#0d3a58,bg=#0088ff]#[fg=#ffffff,bg=#0088ff,bold] #I:#W #[fg=#0088ff,bg=#0d3a58]'
set -g message-style 'fg=#ffc600,bg=#122738'
set -g mode-style 'fg=#ffffff,bg=#0050A4'

# Splits open in current directory
bind '%' split-window -h -c '#{pane_current_path}'
bind '"' split-window -v -c '#{pane_current_path}'

# Fast pane navigation
bind -n C-S-Left select-pane -L
bind -n C-S-Right select-pane -R
bind -n C-S-Up select-pane -U
bind -n C-S-Down select-pane -D

# Mouse + clipboard quality-of-life
set -g mouse on
set -g set-clipboard on
set -gq allow-passthrough all

# Copy selected text to system clipboard (best effort by platform)
if-shell "command -v pbcopy >/dev/null 2>&1" "bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "command -v pbcopy >/dev/null 2>&1" "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'pbcopy'"
if-shell "command -v wl-copy >/dev/null 2>&1" "bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v wl-copy >/dev/null 2>&1" "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'wl-copy'"
if-shell "command -v xclip >/dev/null 2>&1" "bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"
if-shell "command -v xclip >/dev/null 2>&1" "bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel 'xclip -selection clipboard -in'"

# Terminal passthrough improvements (Ghostty/kitty)
set -ga terminal-overrides ',xterm-256color:Ms=\E]52;c;%p2%s\007'
set -ga terminal-overrides ',*:Ss=\E[%p1%d q:Se=\E[2 q'

# Preserve terminal program info inside tmux
set -ga update-environment "TERM_PROGRAM"

# =============================================
# Local plugin — project workspaces / worktrees
# =============================================
set -g @project-workspaces-worktree-root "$HOME/worktrees"
set -g @project-workspaces-projects-file "$HOME/.config/tmux/projects.txt"
set -g @project-workspaces-notify-dir "$HOME/.cache/claude-notify"
set -g @project-workspaces-pr-state-cache-dir "$HOME/.cache/tmux-pr-state"
set -g @project-workspaces-snapshot-file "$HOME/.tmux/resurrect/worktrees.txt"
run-shell "#{HOME}/Code/personal/dotfiles/tmux/plugins/tmux-project-workspaces/tmux-project-workspaces.tmux"

# Last session (Cmd+J)
bind-key -n M-j switch-client -l

# prefix + A — broadcast prompt to every agent pane in every session
bind-key A run-shell "$HOME/.config/tmux/agent-broadcast.sh"

# =============================================
# File explorer & Git UI
# =============================================
bind-key e run-shell '$HOME/.config/tmux/yazi-toggle.sh'
bind-key g display-popup -E -w 90% -h 90% -d "#{pane_current_path}" -b rounded -S "fg=#ffc600" -T " Git " \
  "lazygit"

# =============================================
# Claude Fork Overlay (Cmd+B via Ghostty)
# =============================================
bind-key -n M-b display-popup -E -w 85% -h 85% -d "#{pane_current_path}" \
  -b rounded -S "fg=#ffc600" -T " Claude Fork " \
  "claude --dangerously-skip-permissions --continue --fork-session"

# =============================================
# Plugins (managed by TPM)
# =============================================
set-environment -g TMUX_PLUGIN_MANAGER_PATH "$HOME/.tmux/plugins/"

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Resurrect: restore pane contents and processes
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'claude lazygit'
set -g @resurrect-dir '$HOME/.tmux/resurrect'
set -g @resurrect-hook-pre-save-all "$HOME/.config/tmux/snapshot-worktrees.sh"

# Continuum: auto-save every 15min, auto-restore on tmux start
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (must be last line)
run '~/.tmux/plugins/tpm/tpm'
